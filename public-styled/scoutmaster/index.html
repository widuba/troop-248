<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SM Blog — Troop 248</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/bsafavicon.ico" />

  <style>
    :root{
      --red:#b22222;
      --blue:#1f4e79;
      --tan:#d2cab6;
      --white:#ffffff;
      --radius-lg:16px;
      --radius-pill:999px;
      --shadow-soft:0 10px 25px rgba(0,0,0,.06);

      --rx-blue-900:#0b1f3a;
      --rx-blue-800:#0f2a52;
      --rx-line:rgba(255,255,255,.16);
      --rx-text:#ecf3ff;
      --rx-muted:rgba(236,243,255,.78);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(900px 600px at 40% 20%, rgba(31,78,121,.18), transparent 55%),
        radial-gradient(800px 520px at 70% 30%, rgba(178,34,34,.10), transparent 58%),
        #cfc6b0;
      min-height:100vh;
      color:#1f2933;
    }

    header{
      background:linear-gradient(120deg, #b22222, #ffffff, #1f4e79);
      color:var(--white);
      padding:14px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      position:sticky;
      top:0;
      z-index:20;
      flex-wrap:wrap;
    }

    header h2{
      margin:0;
      font-size:19px;
      letter-spacing:.08em;
      text-transform:uppercase;
      display:flex;
      align-items:center;
      gap:8px;
    }

    header h2::before{
      content:"★";
      font-size:18px;
    }

    .troop-home-link{
      text-decoration:none;
      color:inherit;
      display:inline-flex;
      align-items:center;
    }

    .troop-home-link:hover h2{
      opacity:.9;
      text-decoration:underline;
    }

    .header-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .topBtn{
      padding:8px 12px;
      border-radius:var(--radius-pill);
      border:1px solid rgba(255,255,255,.7);
      background:rgba(255,255,255,.10);
      color:var(--white);
      font-size:13px;
      font-weight:800;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .topBtn:hover{
      background:rgba(255,255,255,.20);
    }

    main{
      max-width:1040px;
      margin:0 auto;
      padding:24px 16px 40px;
    }

    .heroCard,
    .contentCard,
    .postCard{
      background:linear-gradient(180deg, rgba(15,42,82,.96), rgba(11,31,58,.96));
      border-radius:var(--radius-lg);
      border:1px solid var(--rx-line);
      box-shadow:var(--shadow-soft);
      color:var(--rx-text);
      position:relative;
      overflow:hidden;
    }

    .heroCard::after,
    .contentCard::after,
    .postCard::after{
      content:"";
      position:absolute;
      inset:-60px;
      background:
        radial-gradient(circle at 25% 20%, rgba(109,249,255,.12), transparent 45%),
        radial-gradient(circle at 70% 35%, rgba(255,224,109,.10), transparent 45%),
        radial-gradient(circle at 45% 75%, rgba(255,79,216,.08), transparent 45%);
      pointer-events:none;
      opacity:.65;
    }

    .heroCard > *,
    .contentCard > *,
    .postCard > *{
      position:relative;
      z-index:2;
    }

    .heroCard{
      padding:18px;
      margin-bottom:18px;
    }

    .heroTitle{
      margin:0 0 6px;
      font-size:24px;
      line-height:1.08;
    }

    .heroSub{
      margin:0;
      color:var(--rx-muted);
      font-size:14px;
      line-height:1.6;
      font-weight:700;
      max-width:760px;
    }

    .searchWrap{
      margin-top:14px;
      display:grid;
      gap:8px;
    }

    .searchLabel{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:rgba(236,243,255,.72);
      font-weight:900;
    }

    .searchInput{
      width:100%;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      color:var(--rx-text);
      outline:none;
      padding:12px 14px;
      font-size:14px;
      font-weight:700;
    }

    .searchInput::placeholder{
      color:rgba(236,243,255,.48);
    }

    .resultsMeta{
      margin-top:10px;
      color:var(--rx-muted);
      font-size:12px;
      font-weight:800;
    }

    .contentCard{
      padding:18px;
      margin-bottom:16px;
    }

    .backRow{
      margin-bottom:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .linkBtn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:linear-gradient(180deg, rgba(49,130,246,.98), rgba(30,64,175,.98));
      color:#fff;
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
    }

    .linkBtn:hover{
      filter:brightness(1.05);
    }

    .postTitle{
      margin:0 0 8px;
      font-size:30px;
      line-height:1.12;
      font-weight:1000;
    }

    .postMeta{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .metaPill{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      color:rgba(236,243,255,.90);
      font-size:12px;
      font-weight:800;
    }

    .postBody{
      color:var(--rx-text);
      font-size:15px;
      line-height:1.8;
      overflow-wrap:anywhere;
    }

    .postBody b,
    .postBody strong{
      font-weight:900;
    }

    .postBody i,
    .postBody em{
      font-style:italic;
    }

    .listWrap{
      display:grid;
      gap:14px;
    }

    .postCard{
      padding:16px;
    }

    .postCardTitle{
      margin:0 0 8px;
      font-size:18px;
      line-height:1.3;
      font-weight:950;
      color:var(--rx-text);
    }

    .postCardExcerpt{
      margin:0;
      color:var(--rx-muted);
      font-size:14px;
      line-height:1.65;
      font-weight:700;
    }

    .postCardFooter{
      margin-top:12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .emptyState{
      text-align:center;
      padding:24px 18px;
      border:1px dashed rgba(255,255,255,.18);
      border-radius:14px;
      background:rgba(255,255,255,.06);
      color:var(--rx-muted);
      font-size:14px;
      font-weight:800;
      line-height:1.65;
    }

    .loadingState{
      text-align:center;
      padding:20px 18px;
      color:#1f2933;
      font-size:15px;
      font-weight:900;
    }

    .errorState{
      text-align:center;
      padding:20px 18px;
      color:#7f1d1d;
      font-size:15px;
      font-weight:900;
    }

    @media (max-width: 640px){
      header{
        flex-direction:column;
        align-items:flex-start;
      }
      .postTitle{
        font-size:24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <a href="/home" class="troop-home-link"><h2>Troop 248</h2></a>
    </div>

    <div class="header-actions">
      <a class="topBtn" href="/home">Home</a>
    </div>
  </header>

  <main>
    <div class="heroCard">
      <h1 class="heroTitle">SM Blog</h1>
      <p class="heroSub">
        Read the latest published SM blog posts. Use the search box to find posts by title or content.
      </p>

      <div id="searchSection" class="searchWrap">
        <label class="searchLabel" for="searchInput">Search Posts</label>
        <input id="searchInput" class="searchInput" type="text" placeholder="Search SM blog posts" />
        <div id="resultsMeta" class="resultsMeta"></div>
      </div>
    </div>

    <div id="state"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5qUHa2JuQ3iI7U3DrX7JDyhx76PGzhxM",
      authDomain: "troop-248.firebaseapp.com",
      projectId: "troop-248",
      storageBucket: "troop-248.firebasestorage.app",
      messagingSenderId: "925363875752",
      appId: "1:925363875752:web:0b001c1a7a09fb8232f79d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const COLLECTION = "scountmasterPosts";
    const PAGE_TITLE = "SM Blog";
    const PAGE_BASE = "/scoutmaster";

    const state = document.getElementById("state");
    const searchInput = document.getElementById("searchInput");
    const searchSection = document.getElementById("searchSection");
    const resultsMeta = document.getElementById("resultsMeta");

    const params = new URLSearchParams(window.location.search);
    const publicId = params.get("p");

    let publishedPosts = [];

    init();

    async function init(){
      state.innerHTML = `<div class="loadingState">Loading posts…</div>`;

      try{
        await loadPublishedPosts();

        if (publicId){
          renderSinglePost(publicId);
          searchSection.style.display = "none";
        } else {
          renderList();
          searchInput.addEventListener("input", renderList);
        }
      } catch (e){
        console.error(e);
        state.innerHTML = `<div class="errorState">Error loading posts.</div>`;
      }
    }

    async function loadPublishedPosts(){
      const snap = await getDocs(collection(db, COLLECTION));
      const posts = [];

      snap.forEach(docSnap => {
        const d = docSnap.data() || {};
        if ((d.status || "") !== "published") return;

        posts.push({
          docId: docSnap.id,
          id: d.id || "",
          title: d.title || "Untitled",
          content: d.content || "",
          publishedAt: d.publishedAt || d.createdAt || null,
          createdAt: d.createdAt || null,
          authorFullName: d.authorFullName || d.fullName || "Unknown"
        });
      });

      posts.sort((a, b) => toMillis(b.publishedAt) - toMillis(a.publishedAt));
      publishedPosts = posts;
    }

    function renderSinglePost(id){
      const post = publishedPosts.find(p => p.id === id);

      if (!post){
        state.innerHTML = `<div class="errorState">Post not found.</div>`;
        return;
      }

      document.title = `${post.title} — ${PAGE_TITLE} — Troop 248`;

      state.innerHTML = `
        <section class="contentCard">
          <div class="backRow">
            <a class="linkBtn" href="${PAGE_BASE}">← Back to all posts</a>
          </div>

          <h1 class="postTitle">${escapeHtml(post.title)}</h1>

          <div class="postMeta">
            <div class="metaPill">Posted by ${escapeHtml(post.authorFullName)}</div>
            <div class="metaPill">${escapeHtml(formatDate(post.publishedAt))}</div>
          </div>

          <div class="postBody">${post.content || ""}</div>
        </section>
      `;
    }

    function renderList(){
      const q = normalizeText(searchInput.value).toLowerCase();

      let list = publishedPosts;
      if (q){
        list = publishedPosts.filter(post => {
          const hay = `${post.title} ${stripHtml(post.content)}`.toLowerCase();
          return hay.includes(q);
        });
      }

      resultsMeta.textContent = `${list.length} post${list.length === 1 ? "" : "s"} found`;

      if (!list.length){
        state.innerHTML = `
          <div class="emptyState">
            No published posts matched your search.
          </div>
        `;
        return;
      }

      state.innerHTML = `
        <div class="listWrap">
          ${list.map(post => {
            const excerpt = makeExcerpt(stripHtml(post.content), 180);
            return `
              <article class="postCard">
                <h2 class="postCardTitle">${escapeHtml(post.title)}</h2>

                <div class="postMeta">
                  <div class="metaPill">Posted by ${escapeHtml(post.authorFullName)}</div>
                  <div class="metaPill">${escapeHtml(formatDate(post.publishedAt))}</div>
                </div>

                <p class="postCardExcerpt">${escapeHtml(excerpt)}</p>

                <div class="postCardFooter">
                  <div></div>
                  <a class="linkBtn" href="${PAGE_BASE}?p=${encodeURIComponent(post.id)}">Read Post</a>
                </div>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function normalizeText(v){
      return String(v || "").trim();
    }

    function stripHtml(html){
      const temp = document.createElement("div");
      temp.innerHTML = html || "";
      return normalizeText(temp.textContent || "");
    }

    function makeExcerpt(text, max){
      if (!text) return "No excerpt available.";
      if (text.length <= max) return text;
      return text.slice(0, max).trim() + "...";
    }

    function toMillis(v){
      if (!v) return 0;
      try{
        if (typeof v.toDate === "function") return v.toDate().getTime();
        if (v.seconds) return v.seconds * 1000;
        const d = new Date(v);
        if (!Number.isNaN(d.getTime())) return d.getTime();
      } catch (_) {}
      return 0;
    }

    function formatDate(v){
      try{
        if (typeof v?.toDate === "function") return v.toDate().toLocaleString("en-US");
        if (v?.seconds) return new Date(v.seconds * 1000).toLocaleString("en-US");
        const d = new Date(v);
        if (!Number.isNaN(d.getTime())) return d.toLocaleString("en-US");
      } catch (_) {}
      return "Unknown date";
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"
      })[m]);
    }
  </script>
</body>
</html>
