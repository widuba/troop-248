<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SM Blog — Troop 248</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/bsafavicon.ico" />

  <style>
    :root{
      --bg:#0b0f18;
      --panel:#111827;
      --panel2:#0f172a;
      --line:rgba(255,255,255,.10);
      --text:#e5e7eb;
      --muted:rgba(229,231,235,.70);
      --blue:#60a5fa;
      --blue-2:#3b82f6;
      --radius:14px;
      --shadow:0 18px 55px rgba(0,0,0,.45);
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans:system-ui,-apple-system,Segoe UI,sans-serif;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:
        radial-gradient(900px 600px at 20% 10%, rgba(96,165,250,.10), transparent 55%),
        radial-gradient(900px 600px at 80% 20%, rgba(34,197,94,.08), transparent 55%),
        var(--bg);
      color:var(--text);
      font-family:var(--sans);
      min-height:100vh;
    }

    .wrap{
      max-width:1120px;
      margin:0 auto;
      padding:20px 16px 40px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      border:1px solid var(--line);
      background:rgba(17,24,39,.82);
      backdrop-filter:blur(8px);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      position:sticky;
      top:12px;
      z-index:20;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:240px;
    }

    .brand .title{
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-size:12px;
      font-family:var(--mono);
      color:rgba(229,231,235,.92);
    }

    .brand .sub{
      font-size:12px;
      color:var(--muted);
      font-family:var(--mono);
    }

    .top-actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(15,23,42,.75);
      color:rgba(229,231,235,.92);
      font-family:var(--mono);
      font-size:12px;
      white-space:nowrap;
    }

    .btnBlue,
    .btnGhost{
      appearance:none;
      border:1px solid var(--line);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      font-size:13px;
      font-family:var(--mono);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .btnBlue{
      border-color:rgba(96,165,250,.28);
      background:rgba(96,165,250,.12);
      color:rgba(219,234,254,.96);
    }

    .btnGhost{
      border-color:rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:var(--text);
    }

    .btnBlue:hover,
    .btnGhost:hover{
      filter:brightness(1.05);
    }

    .heroCard,
    .panel,
    .postCard{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(17,24,39,.96), rgba(15,23,42,.96));
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .heroCard{
      margin-top:16px;
      padding:18px;
    }

    .heroTitle{
      margin:0 0 8px;
      font-size:28px;
      line-height:1.08;
      font-weight:1000;
    }

    .heroSub{
      margin:0;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
      font-family:var(--mono);
      max-width:780px;
    }

    .searchWrap{
      display:grid;
      gap:6px;
      margin-top:14px;
    }

    .searchLabel{
      font-size:12px;
      color:var(--muted);
      font-family:var(--mono);
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
    }

    .searchInput{
      width:100%;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      color:var(--text);
      padding:12px 12px;
      font:inherit;
      outline:none;
    }

    .searchInput::placeholder{
      color:rgba(229,231,235,.40);
    }

    .resultsMeta{
      margin-top:8px;
      font-size:12px;
      color:var(--muted);
      font-family:var(--mono);
    }

    .content{
      margin-top:16px;
      display:grid;
      gap:14px;
    }

    .panel{
      padding:18px;
    }

    .backRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .postTitle{
      margin:0 0 10px;
      font-size:32px;
      line-height:1.12;
      font-weight:1000;
      overflow-wrap:anywhere;
    }

    .metaRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .metaPill{
      padding:7px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:rgba(229,231,235,.92);
      font-size:12px;
      font-family:var(--mono);
      white-space:nowrap;
    }

    .postBody{
      color:var(--text);
      font-size:15px;
      line-height:1.85;
      overflow-wrap:anywhere;
    }

    .postBody p{
      margin:0 0 1.05em;
    }

    .postBody h1,
    .postBody h2,
    .postBody h3{
      margin:1.15em 0 .55em;
      line-height:1.2;
    }

    .postBody ul,
    .postBody ol{
      padding-left:1.4em;
      margin:.4em 0 1em;
    }

    .postBody blockquote{
      margin:1em 0;
      padding:.9em 1em;
      border-left:4px solid rgba(96,165,250,.55);
      background:rgba(96,165,250,.08);
      border-radius:10px;
      color:rgba(229,231,235,.95);
    }

    .postBody a{
      color:#bfdbfe;
    }

    .postList{
      display:grid;
      gap:14px;
    }

    .postCard{
      padding:16px;
    }

    .postCardTitle{
      margin:0 0 8px;
      font-size:19px;
      line-height:1.3;
      font-weight:950;
      color:var(--text);
      overflow-wrap:anywhere;
    }

    .postExcerpt{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    .postFooter{
      margin-top:12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .emptyState,
    .loadingState,
    .errorState{
      border:1px dashed rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      border-radius:14px;
      padding:18px;
      text-align:center;
      font-family:var(--mono);
      font-size:12px;
      line-height:1.7;
      color:var(--muted);
    }

    .errorState{
      color:#fecaca;
      border-color:rgba(239,68,68,.22);
      background:rgba(239,68,68,.06);
    }

    @media (max-width: 720px){
      .topbar{
        align-items:flex-start;
      }

      .postTitle{
        font-size:26px;
      }

      .heroTitle{
        font-size:24px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title">Troop 248 • SM Blog</div>
        <div class="sub">Published posts only • query view with ?p={id}</div>
      </div>

      <div class="top-actions">
        <a class="btnGhost" href="/home">Home</a>
        <a class="btnGhost" href="/SM">All Posts</a>
        <div class="pill" id="modePill">Loading…</div>
      </div>
    </div>

    <section class="heroCard">
      <h1 class="heroTitle">SM Blog</h1>
      <p class="heroSub">
        Read published SM posts and search through the archive. Open a specific post directly with <span style="color:#bfdbfe;">?p=postid</span>.
      </p>

      <div id="searchSection" class="searchWrap">
        <label class="searchLabel" for="searchInput">Search Posts</label>
        <input id="searchInput" class="searchInput" type="text" placeholder="Search by title or content" />
        <div id="resultsMeta" class="resultsMeta"></div>
      </div>
    </section>

    <div id="content" class="content">
      <div class="loadingState">Loading posts…</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5qUHa2JuQ3iI7U3DrX7JDyhx76PGzhxM",
      authDomain: "troop-248.firebaseapp.com",
      projectId: "troop-248",
      storageBucket: "troop-248.firebasestorage.app",
      messagingSenderId: "925363875752",
      appId: "1:925363875752:web:0b001c1a7a09fb8232f79d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const COLLECTION = "smPosts";
    const PAGE_TITLE = "SM Blog";
    const PAGE_BASE = "/scoutmaster";

    const params = new URLSearchParams(window.location.search);
    const publicId = params.get("p");

    const content = document.getElementById("content");
    const searchInput = document.getElementById("searchInput");
    const searchSection = document.getElementById("searchSection");
    const resultsMeta = document.getElementById("resultsMeta");
    const modePill = document.getElementById("modePill");

    let publishedPosts = [];

    init();

    async function init(){
      try{
        await loadPublishedPosts();

        if (publicId){
          modePill.textContent = "Single Post";
          searchSection.style.display = "none";
          renderSinglePost(publicId);
        } else {
          modePill.textContent = "Post List";
          renderList();
          searchInput.addEventListener("input", renderList);
        }
      } catch (e){
        console.error(e);
        content.innerHTML = `<div class="errorState">Error loading posts.</div>`;
        modePill.textContent = "Error";
      }
    }

    async function loadPublishedPosts(){
      const snap = await getDocs(collection(db, COLLECTION));
      const rows = [];

      snap.forEach(docSnap => {
        const d = docSnap.data() || {};
        if ((d.status || "") !== "published") return;

        rows.push({
          docId: docSnap.id,
          id: d.id || "",
          title: d.title || "Untitled",
          content: d.content || "",
          publishedAt: d.publishedAt || d.createdAt || null,
          createdAt: d.createdAt || null,
          authorFullName: d.authorFullName || d.fullName || "Unknown"
        });
      });

      rows.sort((a, b) => toMillis(b.publishedAt) - toMillis(a.publishedAt));
      publishedPosts = rows;
    }

    function renderSinglePost(id){
      const post = publishedPosts.find(p => p.id === id);

      if (!post){
        content.innerHTML = `<div class="errorState">Post not found.</div>`;
        return;
      }

      document.title = `${post.title} — ${PAGE_TITLE} — Troop 248`;

      content.innerHTML = `
        <section class="panel">
          <div class="backRow">
            <a class="btnBlue" href="${PAGE_BASE}">← Back to all posts</a>
          </div>

          <h1 class="postTitle">${escapeHtml(post.title)}</h1>

          <div class="metaRow">
            <div class="metaPill">Posted by ${escapeHtml(post.authorFullName)}</div>
            <div class="metaPill">${escapeHtml(formatDate(post.publishedAt))}</div>
            <div class="metaPill">ID: ${escapeHtml(post.id || "—")}</div>
          </div>

          <div class="postBody">${post.content || ""}</div>
        </section>
      `;
    }

    function renderList(){
      const q = normalizeText(searchInput.value).toLowerCase();

      let list = publishedPosts;
      if (q){
        list = publishedPosts.filter(post => {
          const hay = `${post.title} ${stripHtml(post.content)}`.toLowerCase();
          return hay.includes(q);
        });
      }

      resultsMeta.textContent = `${list.length} post${list.length === 1 ? "" : "s"} found`;

      if (!list.length){
        content.innerHTML = `<div class="emptyState">No published posts matched your search.</div>`;
        return;
      }

      content.innerHTML = `
        <div class="postList">
          ${list.map(post => {
            const excerpt = makeExcerpt(stripHtml(post.content), 220);
            return `
              <article class="postCard">
                <h2 class="postCardTitle">${escapeHtml(post.title)}</h2>

                <div class="metaRow">
                  <div class="metaPill">Posted by ${escapeHtml(post.authorFullName)}</div>
                  <div class="metaPill">${escapeHtml(formatDate(post.publishedAt))}</div>
                </div>

                <p class="postExcerpt">${escapeHtml(excerpt)}</p>

                <div class="postFooter">
                  <div class="pill">Post ID: ${escapeHtml(post.id || "—")}</div>
                  <a class="btnBlue" href="${PAGE_BASE}?p=${encodeURIComponent(post.id)}">Read Post</a>
                </div>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function normalizeText(v){
      return String(v || "").trim();
    }

    function stripHtml(html){
      const temp = document.createElement("div");
      temp.innerHTML = html || "";
      return normalizeText(temp.textContent || "");
    }

    function makeExcerpt(text, max){
      if (!text) return "No excerpt available.";
      if (text.length <= max) return text;
      return text.slice(0, max).trim() + "...";
    }

    function toMillis(v){
      if (!v) return 0;
      try{
        if (typeof v.toDate === "function") return v.toDate().getTime();
        if (v.seconds) return v.seconds * 1000;
        const d = new Date(v);
        if (!Number.isNaN(d.getTime())) return d.getTime();
      } catch (_) {}
      return 0;
    }

    function formatDate(v){
      try{
        if (typeof v?.toDate === "function") return v.toDate().toLocaleString("en-US");
        if (v?.seconds) return new Date(v.seconds * 1000).toLocaleString("en-US");
        const d = new Date(v);
        if (!Number.isNaN(d.getTime())) return d.toLocaleString("en-US");
      } catch (_) {}
      return "Unknown date";
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"
      })[m]);
    }
  </script>
</body>
</html>
