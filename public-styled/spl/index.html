<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPL Blog — Troop 248</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --blue:#1f4e79;
  --red:#b22222;
  --bg:#cfc6b0;
  --card:#0f2a52;
  --text:#ecf3ff;
  --muted:rgba(236,243,255,.7);
}

body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
}

header{
  background:linear-gradient(120deg,#b22222,#fff,#1f4e79);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{
  margin:0;
  font-size:18px;
  text-transform:uppercase;
}

main{
  max-width:800px;
  margin:24px auto;
  padding:0 16px;
}

.card{
  background:linear-gradient(180deg,#163a72,#0b1f3a);
  border-radius:14px;
  padding:20px;
  color:var(--text);
  box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.title{
  font-size:22px;
  font-weight:900;
  margin-bottom:6px;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-bottom:14px;
}

.content{
  line-height:1.7;
  font-size:15px;
}

.loading{
  text-align:center;
  font-weight:900;
  color:#1f2933;
}

.error{
  text-align:center;
  font-weight:900;
  color:#b22222;
}

</style>
</head>

<body>

<header>
  <h2>Troop 248 — SPL Blog</h2>
</header>

<main>
  <div id="state" class="loading">Loading post…</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5qUHa2JuQ3iI7U3DrX7JDyhx76PGzhxM",
  authDomain: "troop-248.firebaseapp.com",
  projectId: "troop-248",
  storageBucket: "troop-248.firebasestorage.app",
  messagingSenderId: "925363875752",
  appId: "1:925363875752:web:0b001c1a7a09fb8232f79d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔧 CHANGE THIS FOR SM PAGE */
const COLLECTION = "splPosts";

/* GET ID */
const params = new URLSearchParams(window.location.search);
const id = params.get("p");

const state = document.getElementById("state");

if (!id){
  state.className = "error";
  state.textContent = "Invalid post link.";
} else {
  loadPost(id);
}

async function loadPost(id){
  try{
    const ref = doc(db, COLLECTION, id);
    const snap = await getDoc(ref);

    if (!snap.exists()){
      state.className = "error";
      state.textContent = "Post not found.";
      return;
    }

    const d = snap.data();

    renderPost(d);

  }catch(e){
    state.className = "error";
    state.textContent = "Error loading post.";
  }
}

function renderPost(d){
  const created = d.createdAt?.toDate?.() || new Date();

  state.className = "";

  state.innerHTML = `
    <div class="card">
      <div class="title">${escapeHTML(d.title || "Untitled")}</div>

      <div class="meta">
        Posted by ${escapeHTML(d.fullName || "Unknown")} • 
        ${created.toLocaleString()}
      </div>

      <div class="content">
        ${formatContent(d.content || "")}
      </div>
    </div>
  `;
}

/* BASIC FORMAT SUPPORT */
function formatContent(text){
  return text
    .replace(/\n/g,"<br>")
    .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
    .replace(/\*(.*?)\*/g,"<i>$1</i>");
}

function escapeHTML(str){
  return str.replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#039;"
  })[m]);
}
</script>

</body>
</html>
